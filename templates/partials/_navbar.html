<header class="navbar bg-white border-b border-slate-200 px-4 md:px-6 sticky top-0 z-30">
    <!-- Navbar Start: Logo & Brand -->
    <div class="navbar-start flex items-center gap-3">
        <a href="{% url 'accounts:dashboard' %}" class="flex items-center gap-2 group">
            <div class="w-9 h-9 rounded-lg bg-sky-600 text-white flex items-center justify-center shadow-md shadow-sky-600/20 group-hover:bg-sky-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/>
                </svg>
            </div>
            <div>
                <span class="font-bold text-lg tracking-tight text-slate-900 leading-none block">MediCore</span>
                <span class="text-[10px] text-slate-400 font-medium tracking-wide uppercase">Swasthya Sewa</span>
            </div>
        </a>
    </div>

    <!-- Navbar End: Profile / Auth Actions -->
    <div class="navbar-end flex items-center gap-3">
        {% if user.is_authenticated %}
            <!-- User Role Badge -->
            <span class="badge badge-sm font-semibold py-2 px-2.5
                {% if user.is_admin %}badge-error text-white
                {% elif user.is_doctor %}badge-primary text-white
                {% elif user.is_receptionist %}badge-accent text-white
                {% elif user.is_patient %}badge-info text-white
                {% else %}badge-neutral text-white{% endif %}">
                {{ user.get_role_display }}
            </span>

            <!-- User Menu Dropdown (Alpine.js) -->
            <div class="relative" x-data="{ open: false }">
                <button type="button"
                        @click="open = !open"
                        class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-slate-100 transition text-left">
                    <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-700 font-bold flex items-center justify-center text-xs">
                        {{ user.first_name|default:user.email|slice:":1"|upper }}
                    </div>
                    <span class="hidden md:inline-block text-xs font-medium text-slate-700">
                        {{ user.full_name }}
                    </span>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>

                <!-- Dropdown Menu -->
                <div x-show="open"
                     @click.away="open = false"
                     x-transition
                     class="absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-100 py-1.5 z-50">
                    <div class="px-4 py-2 border-b border-slate-100">
                        <p class="text-xs font-semibold text-slate-900 truncate">{{ user.full_name }}</p>
                        <p class="text-[11px] text-slate-400 truncate">{{ user.email }}</p>
                    </div>

                    {% if user.is_admin %}
                        <a href="{% url 'admin:index' %}" class="flex items-center gap-2 px-4 py-2 text-xs text-slate-700 hover:bg-slate-50 transition">
                            <span>Admin Portal</span>
                        </a>
                    {% endif %}

                    <!-- Safe POST Logout Form (CSRF-Protected) -->
                    <form method="post" action="{% url 'accounts:logout' %}" class="w-full">
                        {% csrf_token %}
                        <button type="submit" class="w-full text-left flex items-center gap-2 px-4 py-2 text-xs text-rose-600 hover:bg-rose-50 transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                            <span>Sign Out</span>
                        </button>
                    </form>
                </div>
            </div>
        {% else %}
            <div class="flex items-center gap-2">
                <a href="{% url 'accounts:login' %}" class="btn btn-ghost btn-sm text-xs">
                    Sign In
                </a>
                <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm text-xs text-white">
                    Register as Patient
                </a>
            </div>
        {% endif %}
    </div>
</header>
