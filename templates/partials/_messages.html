{% if messages %}
    <div class="flex flex-col gap-2 max-w-sm w-full">
        {% for message in messages %}
            <div x-data="{ show: true }"
                 x-show="show"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform translate-y-2"
                 x-transition:enter-end="opacity-100 transform translate-y-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 x-init="setTimeout(() => show = false, 5000)"
                 class="alert shadow-lg text-sm flex items-center justify-between
                        {% if message.tags == 'success' %}alert-success text-white bg-emerald-600
                        {% elif message.tags == 'error' %}alert-error text-white bg-rose-600
                        {% elif message.tags == 'warning' %}alert-warning text-slate-900 bg-amber-400
                        {% else %}alert-info text-white bg-sky-600{% endif %}">

                <div class="flex items-center gap-2">
                    {% if message.tags == 'success' %}
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    {% elif message.tags == 'error' %}
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    {% else %}
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    {% endif %}
                    <span>{{ message }}</span>
                </div>

                <button type="button" @click="show = false" class="btn btn-ghost btn-xs btn-circle text-current opacity-70 hover:opacity-100">
                    ✕
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
