<header class="sticky top-0 z-40 w-full bg-white/95 backdrop-blur-md border-b border-slate-200/80 transition-all">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Left: Mobile Drawer Trigger & Brand Logo -->
      <div class="flex items-center gap-3">
        <!-- Mobile Hamburger Trigger (Visible on Mobile/Tablet <lg) -->
        <label for="main-drawer" class="btn btn-ghost btn-circle btn-sm lg:hidden text-slate-700" aria-label="Open menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </label>

        <!-- Brand Link -->
        <a href="{% url 'home' %}" class="flex items-center gap-2.5 group">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-sky-500 text-white flex items-center justify-center shadow-md shadow-sky-600/20 group-hover:scale-105 transition-transform">
            <i data-lucide="cross" class="w-5 h-5 fill-white"></i>
          </div>
          <div class="flex flex-col">
            <span class="font-extrabold text-lg tracking-tight text-slate-900 leading-none">
              Swasthya<span class="text-sky-600">Sewa</span>
            </span>
            <span class="text-[10px] font-medium text-slate-400 tracking-wider">स्वास्थ्य सेवा</span>
          </div>
        </a>
      </div>

      <!-- Center: Desktop Navigation Links (Hidden on Mobile) -->
      <nav class="hidden lg:flex items-center gap-1">
        <a href="{% url 'home' %}" class="px-3.5 py-2 text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-slate-50 rounded-lg transition-colors flex items-center gap-1.5">
          <i data-lucide="home" class="w-4 h-4 text-slate-400"></i>
          <span>Home</span>
        </a>
        <a href="{% url 'doctor_directory' %}" class="px-3.5 py-2 text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-slate-50 rounded-lg transition-colors flex items-center gap-1.5">
          <i data-lucide="stethoscope" class="w-4 h-4 text-slate-400"></i>
          <span>Find Doctors</span>
        </a>
        <a href="{% url 'doctor_directory' %}" class="px-3.5 py-2 text-sm font-medium text-slate-700 hover:text-sky-600 hover:bg-slate-50 rounded-lg transition-colors flex items-center gap-1.5">
          <i data-lucide="grid" class="w-4 h-4 text-slate-400"></i>
          <span>Specialties</span>
        </a>
        <a href="tel:102" class="px-3 py-1.5 text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-lg transition-colors flex items-center gap-1 border border-rose-200">
          <i data-lucide="phone-call" class="w-3.5 h-3.5 text-rose-600 animate-pulse"></i>
          <span>Emergency 102</span>
        </a>
      </nav>

      <!-- Right: User Menu or Auth CTAs -->
      <div class="flex items-center gap-2">
        {% if user.is_authenticated %}
          {% include "components/navigation/user_menu.html" %}
        {% else %}
          <div class="flex items-center gap-2">
            <a href="{% url 'login' %}" class="btn btn-ghost btn-sm text-slate-700 font-semibold rounded-xl text-xs sm:text-sm">
              Sign In
            </a>
            <a href="{% url 'signup' %}" class="btn btn-primary btn-sm rounded-xl font-semibold shadow-sm text-xs sm:text-sm px-3 sm:px-4">
              <i data-lucide="user-plus" class="w-4 h-4 hidden sm:inline-block"></i>
              <span>Register</span>
            </a>
          </div>
        {% endif %}
      </div>

    </div>
  </div>
</header>
