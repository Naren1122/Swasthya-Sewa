<div x-data="{ show: true }" 
     x-show="show" 
     x-init="setTimeout(() => show = false, 4500)"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-2 scale-95"
     x-transition:enter-end="opacity-100 translate-y-0 scale-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 scale-100"
     x-transition:leave-end="opacity-0 scale-95"
     class="pointer-events-auto alert shadow-xl border rounded-2xl flex items-center justify-between text-sm py-3 px-4
       {% if 'error' in tags %}
         alert-error bg-rose-600 text-white border-rose-700
       {% elif 'warning' in tags %}
         alert-warning bg-amber-500 text-white border-amber-600
       {% elif 'info' in tags %}
         alert-info bg-sky-600 text-white border-sky-700
       {% else %}
         alert-success bg-emerald-600 text-white border-emerald-700
       {% endif %}">
       
  <div class="flex items-center gap-2.5">
    {% if 'error' in tags %}
      <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
    {% elif 'warning' in tags %}
      <i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0"></i>
    {% elif 'info' in tags %}
      <i data-lucide="info" class="w-5 h-5 flex-shrink-0"></i>
    {% else %}
      <i data-lucide="check-circle-2" class="w-5 h-5 flex-shrink-0"></i>
    {% endif %}
    <span class="font-medium leading-snug">{{ message }}</span>
  </div>

  <button @click="show = false" class="btn btn-ghost btn-circle btn-xs text-white/80 hover:text-white" aria-label="Dismiss">
    <i data-lucide="x" class="w-4 h-4"></i>
  </button>
</div>
