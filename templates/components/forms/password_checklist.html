<div class="p-3 bg-slate-50 border border-slate-200/80 rounded-xl space-y-1.5 text-xs text-slate-600">
  <p class="font-semibold text-slate-700 text-[11px] uppercase tracking-wider">Password Requirements:</p>
  
  <div class="grid grid-cols-2 gap-1.5">
    <!-- Length Requirement -->
    <div class="flex items-center gap-1.5" :class="password.length >= 8 ? 'text-emerald-600 font-medium' : 'text-slate-400'">
      <i data-lucide="check" class="w-3.5 h-3.5" x-show="password.length >= 8"></i>
      <i data-lucide="circle" class="w-3.5 h-3.5" x-show="password.length < 8"></i>
      <span>Min. 8 characters</span>
    </div>

    <!-- Letter cases -->
    <div class="flex items-center gap-1.5" :class="(/[a-z]/.test(password) && /[A-Z]/.test(password)) ? 'text-emerald-600 font-medium' : 'text-slate-400'">
      <i data-lucide="check" class="w-3.5 h-3.5" x-show="/[a-z]/.test(password) && /[A-Z]/.test(password)"></i>
      <i data-lucide="circle" class="w-3.5 h-3.5" x-show="!(/[a-z]/.test(password) && /[A-Z]/.test(password))"></i>
      <span>Upper & lower case</span>
    </div>

    <!-- Number -->
    <div class="flex items-center gap-1.5" :class="/\d/.test(password) ? 'text-emerald-600 font-medium' : 'text-slate-400'">
      <i data-lucide="check" class="w-3.5 h-3.5" x-show="/\d/.test(password)"></i>
      <i data-lucide="circle" class="w-3.5 h-3.5" x-show="!/\d/.test(password)"></i>
      <span>At least one number</span>
    </div>

    <!-- Special Symbol -->
    <div class="flex items-center gap-1.5" :class="/[@$!%*?&#]/.test(password) ? 'text-emerald-600 font-medium' : 'text-slate-400'">
      <i data-lucide="check" class="w-3.5 h-3.5" x-show="/[@$!%*?&#]/.test(password)"></i>
      <i data-lucide="circle" class="w-3.5 h-3.5" x-show="!/[@$!%*?&#]/.test(password)"></i>
      <span>Special character</span>
    </div>
  </div>
</div>
