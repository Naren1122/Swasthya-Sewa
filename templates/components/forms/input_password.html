<div class="form-control w-full" x-data="{ show: false }">
  <div class="flex items-center justify-between pb-1.5">
    {% if label %}
    <label class="label p-0" for="{{ field.id_for_label }}">
      <span class="label-text font-semibold text-slate-700 text-xs uppercase tracking-wider">{{ label }}</span>
      {% if required %}<span class="label-text-alt text-rose-500 font-bold ml-1">*</span>{% endif %}
    </label>
    {% endif %}

    {% if forgot_url %}
    <a href="{{ forgot_url }}" class="text-xs font-semibold text-sky-600 hover:text-sky-700 hover:underline">
      Forgot password?
    </a>
    {% endif %}
  </div>

  <div class="relative">
    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
      <i data-lucide="lock" class="w-4 h-4"></i>
    </span>

    <input :type="show ? 'text' : 'password'"
           name="{{ field.name }}"
           id="{{ field.id_for_label }}"
           placeholder="{{ placeholder|default:'••••••••' }}"
           {% if required %}required{% endif %}
           {% if x_model %}x-model="{{ x_model }}"{% endif %}
           autocomplete="{{ autocomplete|default:'current-password' }}"
           class="input input-bordered w-full rounded-xl text-sm transition-all focus:input-primary bg-white text-slate-900 border-slate-300 pl-10 pr-10 {% if field.errors %}input-error border-rose-500 focus:input-error{% endif %}">

    <!-- Show / Hide Password Button -->
    <button type="button" 
            @click="show = !show"
            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
            tabindex="-1"
            aria-label="Toggle password visibility">
      <i :data-lucide="show ? 'eye-off' : 'eye'" class="w-4 h-4" x-show="!show"></i>
      <i data-lucide="eye-off" class="w-4 h-4" x-show="show" style="display: none;"></i>
    </button>
  </div>

  {% if field.errors %}
  <label class="label pt-1 pb-0">
    <span class="label-text-alt text-rose-600 font-medium text-xs flex items-center gap-1">
      <i data-lucide="alert-triangle" class="w-3 h-3"></i>
      {{ field.errors.0 }}
    </span>
  </label>
  {% elif help_text %}
  <label class="label pt-1 pb-0">
    <span class="label-text-alt text-slate-400 text-xs">{{ help_text }}</span>
  </label>
  {% endif %}
</div>
