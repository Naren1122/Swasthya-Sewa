<div class="card bg-white border border-slate-200/90 rounded-2xl shadow-sm hover:shadow-md transition-all p-5 flex flex-col justify-between">
  <div class="flex items-start justify-between">
    <div>
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">{{ title }}</p>
      <h3 class="text-2xl font-extrabold text-slate-900 mt-1">{{ value|default:"0" }}</h3>
    </div>
    <div class="w-11 h-11 rounded-2xl bg-{{ color|default:'sky' }}-50 text-{{ color|default:'sky' }}-600 flex items-center justify-center border border-{{ color|default:'sky' }}-100 shadow-sm">
      <i data-lucide="{{ icon|default:'activity' }}" class="w-5 h-5"></i>
    </div>
  </div>
  
  {% if subtitle %}
  <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
    <span class="text-slate-500">{{ subtitle }}</span>
    {% if action_url %}
    <a href="{{ action_url }}" class="font-bold text-sky-600 hover:text-sky-700 flex items-center gap-1">
      <span>{{ action_label|default:"View" }}</span>
      <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
    </a>
    {% endif %}
  </div>
  {% endif %}
</div>
