{% if slot.is_bookable %}
  <button type="button"
          class="btn btn-outline btn-success hover:text-white rounded-2xl flex flex-col items-center justify-center py-2.5 h-auto transition-all shadow-sm group hover:scale-[1.02] border-emerald-500 bg-emerald-50/40"
          title="Select {{ slot.formatted_time }} slot">
    <span class="text-sm font-extrabold text-emerald-800 group-hover:text-white leading-tight">
      {{ slot.formatted_time }}
    </span>
    <span class="text-[10px] font-semibold text-emerald-600 group-hover:text-white uppercase tracking-wider mt-0.5">
      Available
    </span>
  </button>
{% elif slot.status == 'BOOKED' %}
  <button type="button" disabled
          class="btn btn-disabled bg-slate-100 border border-slate-200 text-slate-400 rounded-2xl flex flex-col items-center justify-center py-2.5 h-auto cursor-not-allowed opacity-60">
    <span class="text-sm font-bold text-slate-500 leading-tight line-through">
      {{ slot.formatted_time }}
    </span>
    <span class="text-[10px] uppercase tracking-wider text-slate-400 mt-0.5">
      Booked
    </span>
  </button>
{% else %}
  <button type="button" disabled
          class="btn btn-disabled bg-slate-50 border border-slate-200 text-slate-400 rounded-2xl flex flex-col items-center justify-center py-2.5 h-auto cursor-not-allowed opacity-50">
    <span class="text-sm font-medium text-slate-400 leading-tight">
      {{ slot.formatted_time }}
    </span>
    <span class="text-[10px] uppercase tracking-wider text-slate-400 mt-0.5">
      Past
    </span>
  </button>
{% endif %}
