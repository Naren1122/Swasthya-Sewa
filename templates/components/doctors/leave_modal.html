<!-- DaisyUI Declare Leave Modal -->
<dialog id="add-leave-modal" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box bg-white rounded-3xl p-6 sm:p-8 max-w-md shadow-2xl border border-slate-200">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center">
          <i data-lucide="calendar-off" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-extrabold text-lg text-slate-900 leading-tight">Declare Out of Office</h3>
          <p class="text-xs text-slate-500">Block patient bookings for this date</p>
        </div>
      </div>
      <form method="dialog">
        <button class="btn btn-ghost btn-circle btn-sm text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </form>
    </div>

    <!-- Form -->
    <form method="POST" action="{% url 'doctor_leave_create' %}" class="space-y-4 mt-5">
      {% csrf_token %}

      <!-- Leave Date -->
      <div class="form-control w-full">
        <label class="label pb-1.5 pt-0" for="{{ leave_form.leave_date.id_for_label }}">
          <span class="label-text font-bold text-xs uppercase tracking-wider text-slate-700">Leave Date</span>
        </label>
        <input type="date"
               name="leave_date"
               id="{{ leave_form.leave_date.id_for_label }}"
               min="{{ today|date:'Y-m-d' }}"
               required
               class="input input-bordered w-full rounded-xl text-sm focus:input-primary bg-white text-slate-900">
      </div>

      <!-- Reason -->
      <div class="form-control w-full">
        <label class="label pb-1.5 pt-0" for="{{ leave_form.reason.id_for_label }}">
          <span class="label-text font-bold text-xs uppercase tracking-wider text-slate-700">Reason / Notice</span>
        </label>
        {{ leave_form.reason }}
      </div>

      <!-- Safety Notice -->
      <div class="p-3 bg-amber-50/70 border border-amber-100 rounded-xl text-xs text-amber-800 flex items-start gap-2">
        <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-600 flex-shrink-0 mt-0.5"></i>
        <span>Declaring leave automatically closes all consultation slots for this date across the public directory.</span>
      </div>

      <!-- Actions -->
      <div class="modal-action pt-2">
        <button type="button" onclick="document.getElementById('add-leave-modal').close()" class="btn btn-ghost btn-sm rounded-xl text-slate-600">
          Cancel
        </button>
        <button type="submit" class="btn btn-warning btn-sm rounded-xl font-bold text-white shadow-md shadow-amber-600/20 px-5 gap-2">
          <i data-lucide="check" class="w-4 h-4"></i>
          <span>Confirm Leave</span>
        </button>
      </div>

    </form>
  </div>
  <form method="dialog" class="modal-backdrop bg-slate-900/40 backdrop-blur-sm">
    <button>close</button>
  </form>
</dialog>
