<div class="space-y-2">
  <label for="slot-date-picker" class="block text-xs font-bold uppercase tracking-wider text-slate-700">
    Or Pick Any Future Date
  </label>
  <div class="relative">
    <input type="date"
           id="slot-date-picker"
           name="date"
           x-model="selectedDate"
           value="{{ target_date|default:today|date:'Y-m-d' }}"
           min="{{ today|date:'Y-m-d' }}"
           hx-get="{% url 'doctor_slots_partial' doctor.slug %}"
           hx-trigger="change"
           hx-target="#slot-container"
           hx-swap="outerHTML"
           hx-indicator="#slot-spinner"
           class="input input-bordered w-full rounded-2xl text-sm font-semibold text-slate-900 border-slate-300 focus:input-primary shadow-sm bg-white">
    <span id="slot-spinner" class="htmx-indicator absolute inset-y-0 right-0 pr-4 flex items-center text-sky-600">
      <span class="loading loading-spinner loading-sm"></span>
    </span>
  </div>
</div>
