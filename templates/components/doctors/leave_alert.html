<div class="alert alert-warning bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-4 text-xs shadow-sm flex items-start gap-3">
  <i data-lucide="calendar-off" class="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5"></i>
  <div class="space-y-1">
    <p class="font-bold text-amber-900 text-sm">Doctor on Approved Leave</p>
    <p class="leading-relaxed">{{ message|default:"The doctor is away on this date. Please choose another date on the calendar above." }}</p>
  </div>
</div>
