{% comment %}
  Atomic Component: 7-Day Horizontal Quick-Selector Strip
  Enables 1-click booking of upcoming days with Alpine.js active state and HTMX dynamic slot load.
{% endcomment %}
<div class="space-y-2">
  <div class="flex items-center justify-between">
    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700">
      Upcoming Days
    </label>
    <span class="text-[11px] text-slate-400 font-medium">Next 7 Days</span>
  </div>

  <div class="flex items-center gap-2 overflow-x-auto pb-2 pt-0.5 -mx-1 px-1 no-scrollbar sm:grid sm:grid-cols-7 sm:gap-2 sm:overflow-visible">
    {% for day in upcoming_days %}
      <button type="button"
              @click="selectedDate = '{{ day.date_str }}'"
              hx-get="{% url 'doctor_slots_partial' doctor.slug %}?date={{ day.date_str }}"
              hx-target="#slot-container"
              hx-swap="outerHTML"
              hx-indicator="#slot-spinner"
              :class="selectedDate === '{{ day.date_str }}'
                ? 'bg-sky-600 text-white border-sky-600 shadow-md ring-2 ring-sky-500/25'
                : 'bg-white hover:bg-slate-50 text-slate-700 border-slate-200/90'"
              class="flex-shrink-0 w-16 sm:w-auto py-2.5 px-2 rounded-2xl border text-center transition-all duration-150 flex flex-col items-center justify-between gap-1 group cursor-pointer focus:outline-none">
        
        <!-- Day Label (Today, Tomorrow, Mon, etc.) -->
        <span class="text-[10px] font-bold uppercase tracking-tight block truncate w-full"
              :class="selectedDate === '{{ day.date_str }}' ? 'text-sky-100' : 'text-slate-400 group-hover:text-slate-600'">
          {{ day.day_label }}
        </span>

        <!-- Day Number -->
        <span class="text-base sm:text-lg font-extrabold leading-none block">
          {{ day.day_num }}
        </span>

        <!-- Month & Availability Dot -->
        <div class="flex items-center gap-1">
          <span class="text-[10px] font-semibold leading-none"
                :class="selectedDate === '{{ day.date_str }}' ? 'text-sky-100' : 'text-slate-400'">
            {{ day.month_name }}
          </span>
          {% if day.is_scheduled %}
            <span class="w-1.5 h-1.5 rounded-full"
                  :class="selectedDate === '{{ day.date_str }}' ? 'bg-emerald-300' : 'bg-emerald-500'"
                  title="Shift Scheduled"></span>
          {% else %}
            <span class="w-1.5 h-1.5 rounded-full"
                  :class="selectedDate === '{{ day.date_str }}' ? 'bg-sky-400/60' : 'bg-slate-200'"
                  title="No shift or leave"></span>
          {% endif %}
        </div>
      </button>
    {% endfor %}
  </div>
</div>
