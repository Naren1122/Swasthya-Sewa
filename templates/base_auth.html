{% extends "base.html" %}

{% block shell %}
<div class="min-h-screen bg-gradient-to-br from-slate-50 via-sky-50/30 to-slate-100 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <!-- Brand Header -->
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-sky-600 text-white shadow-lg shadow-sky-500/20 mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 2a2 2 0 0 0-2 2v5H4a2 2 0 0 0-2 2v2c0 1.1.9 2 2 2h5v5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-5h5a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2h-5V4a2 2 0 0 0-2-2h-2z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900">
            MediCore
        </h1>
        <p class="mt-1 text-sm text-slate-500">
            Swasthya Sewa — Centralized Hospital Operations & Patient Care
        </p>
    </div>

    <!-- Centered Card Body -->
    <div class="mt-8 sm:mx-auto sm:w-full {% block auth_card_width %}sm:max-w-md{% endblock %}">
        <div class="bg-white py-8 px-6 shadow-xl shadow-slate-200/50 sm:rounded-2xl border border-slate-100 sm:px-10">
            {% block auth_content %}{% endblock %}
        </div>

        <!-- Footer Notice -->
        <p class="mt-6 text-center text-xs text-slate-400">
            &copy; {% now "Y" %} MediCore Hospital System. Confidential & Secure.
        </p>
    </div>
</div>
{% endblock %}
