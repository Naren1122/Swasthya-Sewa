<form method="post"
      action="{% url 'accounts:login' %}"
      hx-post="{% url 'accounts:login' %}"
      hx-target="#login-form-container"
      hx-swap="innerHTML"
      hx-indicator="#login-spinner"
      class="space-y-4">
    {% csrf_token %}

    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <!-- Non-field Errors / Invalid Credentials Alert -->
    {% if form.non_field_errors %}
        <div class="alert alert-error text-xs text-white bg-rose-600 rounded-xl p-3 shadow-sm flex items-start gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div class="flex-1">
                {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        </div>
    {% endif %}

    <!-- Email Field -->
    <div class="form-control">
        <label class="label pb-1.5" for="{{ form.email.id_for_label }}">
            <span class="label-text text-xs font-semibold text-slate-700">Email Address</span>
        </label>
        {{ form.email }}
        {% if form.email.errors %}
            <label class="label pt-1">
                <span class="label-text-alt text-xs text-rose-600 font-medium">{{ form.email.errors.0 }}</span>
            </label>
        {% endif %}
    </div>

    <!-- Password Field -->
    <div class="form-control">
        <label class="label pb-1.5" for="{{ form.password.id_for_label }}">
            <span class="label-text text-xs font-semibold text-slate-700">Password</span>
        </label>
        {{ form.password }}
        {% if form.password.errors %}
            <label class="label pt-1">
                <span class="label-text-alt text-xs text-rose-600 font-medium">{{ form.password.errors.0 }}</span>
            </label>
        {% endif %}
    </div>

    <!-- Submit Button -->
    <div class="pt-2">
        <button type="submit" class="btn btn-primary w-full text-white font-medium text-sm flex items-center justify-center gap-2 shadow-md shadow-sky-600/20">
            <span>Sign In</span>
            <span id="login-spinner" class="htmx-indicator loading loading-spinner loading-xs text-white"></span>
        </button>
    </div>
</form>
